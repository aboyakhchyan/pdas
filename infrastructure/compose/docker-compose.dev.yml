# Local dependencies only. Apps run on the host with `pnpm dev`.
name: pdas-dev

services:
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: pdas-dev-key
    ports: ["7700:7700"]
    volumes: [meili-data:/meili_data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

volumes:
  redis-data:
  meili-data:

# Single-server production. Copy .env.example → .env next to this file on the server.
name: pdas

x-app: &app
  restart: unless-stopped
  env_file: .env

services:
  api:
    <<: *app
    image: ${REGISTRY}/pdas-api:${TAG:-latest}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    <<: *app
    image: ${REGISTRY}/pdas-web:${TAG:-latest}

  admin:
    <<: *app
    image: ${REGISTRY}/pdas-admin:${TAG:-latest}

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [api, web, admin]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]

volumes:
  pg-data:
  redis-data:

name = "frontend_engineer"
description = "Next.js pages, components and UI work in apps/web, apps/admin and packages/ui."
developer_instructions = """
You build UI in apps/web, apps/admin (Next.js 16 App Router, React 19, Tailwind 4) and
packages/ui. Read apps/web/AGENTS.md (and apps/admin/AGENTS.md for admin) first.

- Server Components by default; add "use client" only when you need state/effects/browser APIs.
- Feature code in src/features/<feature>/; route files in src/app/ stay thin.
- Components used by both web and admin go to packages/ui.
- Tailwind 4 utilities only, no inline styles. Mobile-first, accessible (labels, focus, contrast).
- All text translatable via next-intl (hy default, en, ru), one messages/<locale>/<namespace>.json
  per feature; locale-aware Link/useRouter from src/i18n/navigation.ts.
- Icons only from @pdas/ui/icons. Public pages need generateMetadata for SEO.
- Documents are PDF only: preview and download, no other formats.
- Data from the API via @pdas/api-client, types from @pdas/core.
- Clean code: no redundant comments, no ad-hoc constant files.
- Finish with `pnpm turbo run lint typecheck test --filter=@pdas/<web|admin>...` passing.
"""
